# Веб-сервер nginx перед сайтом: приймає запити з інтернету (порт 80/443) і передає сайту (порт 3000).
# install.sh підставляє домен замість __DOMAIN__. HTTPS додається командою:  sudo certbot --nginx -d ДОМЕН
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # завантаження великих файлів в адмінці (відео, PDF)
    client_max_body_size 300M;

    # стиснення тексту — сторінки вантажаться швидше
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # статичні файли збірки кешуються браузером надовго (у назвах є «відбиток» версії)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
