# Веб-сервер nginx перед сайтом: приймає запити з інтернету (порт 80/443) і передає сайту (порт 3000).
# install.sh підставляє домен замість __DOMAIN__. HTTPS додається командою:  sudo certbot --nginx -d ДОМЕН
# підбір пароля: не більше 10 спроб входу за хвилину з однієї адреси (ще й акаунт блокується після 5 невдалих)
limit_req_zone $binary_remote_addr zone=nartu_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # не показуємо версію nginx
    server_tokens off;

    # завантаження великих файлів в адмінці (відео, PDF)
    client_max_body_size 300M;

    # стиснення тексту — сторінки вантажаться швидше
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # статичні файли збірки кешуються браузером надовго (у назвах є «відбиток» версії)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # вхід в адмінку й відновлення пароля — з обмеженням частоти
    location ~ ^/api/users/(login|forgot-password|reset-password) {
        limit_req zone=nartu_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
